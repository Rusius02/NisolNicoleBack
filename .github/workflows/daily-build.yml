name: Daily Build

# Déclenchement du workflow
on:
  # Planification quotidienne à 2h du matin UTC (3h en France)
  schedule:
    - cron: "0 2 * * *"
  # Permet de lancer le workflow manuellement depuis GitHub
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Solution
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupère le code depuis ton dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Installe le SDK .NET (version 8 recommandée)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Étape 3 : Restaure les dépendances de tous les projets
      - name: Restore dependencies
        run: dotnet restore NisolNicole.sln

      # Étape 4 : Compile la solution complète
      - name: Build solution
        run: dotnet build NisolNicole.sln --configuration Release --no-restore

      # Étape 5 : Exécute les tests unitaires
      - name: Run tests
        run: dotnet test NisolNicole.sln --no-build --verbosity normal

      # Étape 6 (optionnelle) : Upload des artefacts du build
      # Si tu veux garder les binaires du build, décommente ce bloc
      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: NisolNicole-build
      #     path: |
      #       **/bin/Release/